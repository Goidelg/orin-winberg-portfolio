<!doctype html>
<html lang="en" dir="ltr" data-view="desk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffbf6" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Orin Winberg | Storytelling, Books & AI Education</title>
    <meta
      name="description"
      content="Portfolio of Orin Winberg — AI Literacy Narratologist at Google, published author and editor, and former Ynet Arts & Culture editor."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const savedLang = (() => {
          try { return localStorage.getItem("orin-lang"); } catch { return null; }
        })();
        const lang = savedLang === "he" ? "he" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
        const isBoringPath = /\/boring\/?$/.test(location.pathname);
        if (isBoringPath) {
          const cleanPath = location.pathname.replace(/\/boring\/?$/, "/");
          history.replaceState(null, "", cleanPath + "#boring");
        }
        const isBoring = isBoringPath || location.hash === "#boring" || location.hash === "#shelf";
        document.documentElement.dataset.view = isBoring ? "shelf" : "desk";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
